<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border outline -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Inner Content (Inside 80% Safe Zone for Maskable Icons) -->
  <g filter="url(#glow)">
    <!-- Roadmap Node Grid / Pathways -->
    <path d="M156 360 L256 300 L356 360" fill="none" stroke="#475569" stroke-width="8" stroke-dasharray="8 8" stroke-linecap="round"/>
    <path d="M256 300 L256 220" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Angle Bracket < -->
    <path d="M170 190 L110 256 L170 322" fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Angle Bracket > -->
    <path d="M342 190 L402 256 L342 322" fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Code / Terminal Star Milestone (SWE + Germany Target) -->
    <circle cx="256" cy="200" r="44" fill="#1E293B" stroke="url(#blueGrad)" stroke-width="12"/>
    
    <!-- Milestone Compass / Star Icon -->
    <polygon points="256,176 264,194 282,196 268,208 273,226 256,215 239,226 244,208 230,196 248,194" fill="#38BDF8"/>

    <!-- Lower Target Milestone Badge -->
    <circle cx="156" cy="360" r="14" fill="#3B82F6"/>
    <circle cx="256" cy="300" r="16" fill="#10B981"/>
    <circle cx="356" cy="360" r="14" fill="url(#accentGrad)"/>
  </g>

  <!-- German Colors Indicator Micro-Bar at Bottom -->
  <g transform="translate(196, 420)">
    <rect x="0" y="0" width="40" height="8" rx="4" fill="#000000"/>
    <rect x="40" y="0" width="40" height="8" rx="4" fill="#DD0000"/>
    <rect x="80" y="0" width="40" height="8" rx="4" fill="#FFCC00"/>
  </g>
</svg>
